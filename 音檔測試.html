<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>白話字練習器音檔測試</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:700px;margin:25px auto;padding:0 16px;color:#222}button{font:inherit;padding:10px;margin:8px 0;background:#f2f2f2;border:1px solid #aaa;border-radius:8px}audio{width:100%;margin:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;padding:10px}</style></head><body><h2>白話字音檔檢查</h2><p>請先完整解壓縮 ZIP，再按下方「播放測試」；本頁使用 ZIP 內的真實 MP3，不需要網路。</p><button id="a">▶ 播放主程式例音：巴 (pa)</button><button id="b">▶ 播放辭庫例音：巴 (pa)</button><audio id="player" controls playsinline preload="none"></audio><p id="status">尚未測試。</p><pre id="detail"></pre><script>const player=document.getElementById('player'),status=document.getElementById('status'),detail=document.getElementById('detail');async function test(path){player.pause();player.src=path;player.load();status.textContent='讀取：'+path;detail.textContent='位置：'+location.href+'\n音檔：'+new URL(path,location.href).href;try{await player.play();status.textContent='✅ 瀏覽器已開始播放：'+path;}catch(e){status.textContent='❌ 播放失敗：'+e.name+' - '+e.message;}}document.getElementById('a').onclick=()=>test('audio/1_01_pa.mp3');document.getElementById('b').onclick=()=>test('dictionary/audio/1_01_pa.mp3');player.onerror=()=>{status.textContent='❌ 音檔載入錯誤（HTMLMediaElement code '+(player.error?.code||'?')+'）：'+player.currentSrc;};</script></body></html>
