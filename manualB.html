<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白話字拼讀寫閃卡練習器 李香恩</title>
<style>
:root{--bg:#faf8f4;--fg:#2b2a27;--mut:#77736a;--card:#fff;--line:#e2ddd2;--ac:#c2410c;--acbg:#fde8dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#1d1c1a;--fg:#ece8df;--mut:#9b968a;--card:#2a2825;--line:#3d3a35;--ac:#fb923c;--acbg:#3b2a1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;padding:16px;max-width:520px;margin-inline:auto}
h1{font-size:18px;margin:4px 0 12px}
.tabs{display:grid;grid-template-columns:minmax(0,.99825fr) minmax(0,.99825fr) minmax(0,1.012fr) minmax(0,1.11325fr) minmax(0,.77825fr);gap:6px;margin-bottom:10.5px}
.tabs :is(button,#tDictionary){flex:1;height:37.5px;padding:0 6.75px;line-height:1.2;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font-size:21px}
.tabs :is(button,#tDictionary).on{background:var(--ac);color:#fff;border-color:var(--ac)}
.out{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:9px 10px 3.375px}
.word{font-size:42px;line-height:1.2;font-family:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;min-height:57px}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.tone-diagrams{position:relative;height:73px;margin-top:-5px}
.tone-diagrams svg{display:block;width:100%;height:73px;margin:0;transform-box:border-box;transform:translateX(-16.6666666667%)}
#sandhiSvg{position:absolute;left:0;top:0;transform:translateX(16.6666666667%)}
.base-tone-label{font-size:21px}
.lab{font-size:18px;color:var(--mut);margin:14px 0 6px}
.out + .lab{margin-top:5.25px}
.row{display:flex;flex-wrap:wrap;gap:6px}
.row button{padding:7px 11px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:9px;font-size:24px;font-family:"Charis SIL","Gentium Plus","Noto Serif",serif}
.row button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.row button:disabled{opacity:.3}
#ini button:disabled,#vow button:disabled,#cod button:disabled{color:#a4a4a4;opacity:.4;cursor:not-allowed;border-color:var(--bd);background:transparent;box-shadow:none}

.app[data-page=listen] .page-switch{display:flex}
.page-switch button{display:none}
.app[data-page=listen] #dict-tab-examples{display:block;min-height:40px}

/* Match the parent combiner's surfaces, type, controls, and system theme. */
:scope{--bg:#faf8f4;--fg:#2b2a27;--mut:#77736a;--card:#fff;--line:#e2ddd2;--ac:#c2410c;--acbg:#fde8dc;--ink:var(--fg);--muted:var(--mut);--green:var(--ac);--paper:var(--bg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--fg);background:var(--bg);color-scheme:light}

:scope{background:var(--bg);color:var(--fg)}
.app{background:var(--bg);border:0;border-radius:0;gap:8px;padding:0}
button,select{font:inherit;color:var(--fg)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
a{color:var(--ac)}
.panel{padding:0;scrollbar-gutter:auto}
.tones{gap:6px;margin:0 0 10px}
.tone{min-height:60px;padding:7px 2px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg)}
.tone small{font-size:12px;color:var(--mut);line-height:1.4}
.tone b{font-family:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;font-size:26px;line-height:1.2;font-weight:400}
.tone .tone-endings{font-size:18px;letter-spacing:-.7px}
.tone[aria-pressed=true]{background:var(--acbg);border-color:var(--ac);color:var(--ac);font-weight:600}
.tone[aria-pressed=true] small{color:var(--ac)}
.tone-ending-letter.is-match{color:var(--ac);font-weight:700}
.practice-tools{column-gap:6px;row-gap:3px;margin-bottom:5px}
.practice-modes{gap:6px;font-size:13px;align-items:center}
.practice-modes button{height:18px;min-height:18px;padding:0 8px;font-size:inherit;font-weight:400;line-height:1;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:9px}
.practice-modes button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.practice-result-hint{font-size:inherit;color:var(--mut);line-height:1.4}
.practice-speed{height:19px;font-size:13px;font-weight:400;line-height:1;gap:6px;color:var(--mut);padding:0 6px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.practice-speed select{height:17px;min-height:0;min-width:46.2px;padding:0 1px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);font-size:13px;line-height:1.2}
.toolbar-sample-count{color:var(--mut);font-size:12px}
.samples{gap:6px;padding:0 0 8px;scrollbar-color:var(--line) var(--bg)}
.sample{min-height:44px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg)}
.sample b{font-family:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;font-size:20px;font-weight:400;line-height:1.3}
.sample small{font-family:inherit;font-size:16px;color:var(--mut)}
.sample[aria-pressed=true]{border:1px solid var(--ac);background:var(--acbg);color:var(--ac)}
.sample[aria-pressed=true] small{color:var(--ac)}
.page-switch button{height:37.5px;min-height:37.5px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;color:var(--fg)}
.app[data-page=listen] #dict-tab-examples{min-height:37.5px}
.player{padding:9px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.voice-display{gap:8px;grid-template-columns:minmax(0,1fr)}
.voice-text-columns{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.app[data-page=listen] :is(.syllable,.han){font-size:42px;line-height:1.2;font-weight:400;min-height:57px}
.syllable{font-family:"Charis SIL","Gentium Plus","Noto Serif","Times New Roman",serif;color:var(--fg)}
.han{font-family:inherit;color:var(--ac)}
.listen-controls{padding-top:0;gap:8px}
.playrow{flex-direction:row;justify-content:center;gap:8px;flex-wrap:wrap}
.primary,.secondary{min-height:34px;padding:8px 16px;border:1px dashed var(--mut);border-radius:20px;background:transparent;color:var(--mut);font-size:13px;font-weight:400;line-height:1.2}
.source-row{font-size:13px;line-height:1.5;color:var(--ac)}
.status{font-size:13px;color:var(--mut)}
.load-message{background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:16px;font-size:13px}
@media(max-width:380px){.tone .tone-endings{font-size:15px}.practice-modes{gap:4px}.practice-modes button{padding-inline:6px}}

.sample small{display:inline;line-height:1.5;overflow-wrap:anywhere}
.dictionary-meanings{text-align:left;padding:3px 0;margin:0}
.meaning-label{color:var(--mut);font-size:13px;margin-bottom:6px}
.dictionary-meaning-list{display:flex;flex-wrap:wrap;gap:6px}
.dictionary-meaning-list a{color:var(--ac);background:var(--acbg);border:1px solid var(--line);border-radius:9px;padding:5px 10px;min-height:36px;font-size:16px;line-height:1.5;text-decoration:none}
.recorded-headword{color:var(--mut);font-size:12px;margin:6px 0 0}

.tone-pair-info{text-align:left;border-top:1px solid var(--line);padding-top:8px;font-size:13px;line-height:1.5}
.pair-example{display:grid;grid-template-columns:2.5em minmax(0,1fr) auto;align-items:baseline;gap:6px;margin-bottom:6px}
.pair-example>span{color:var(--mut)}
.pair-example>div{overflow-wrap:anywhere}
.pair-example a{color:var(--ac);font-size:12px;white-space:nowrap}
.pair-rule,.pair-note{color:var(--mut);font-size:12px;margin:4px 0}
.pair-status{color:var(--ac);font-size:13px;margin:6px 0 0;min-height:1.5em}
.playrow button:disabled{opacity:.4;cursor:default}
.playrow button[aria-pressed=true]{border-color:var(--ac);color:var(--ac);background:var(--acbg)}

:scope{--bg:#1d1c1a;--fg:#ece8df;--mut:#9b968a;--card:#2a2825;--line:#3d3a35;--ac:#fb923c;--acbg:#3b2a1d;color-scheme:dark}
:scope{background-color:var(--bg)}
audio{color-scheme:light}

function initializeDictionary(root) {

const MARKS={2:'\u0301',3:'\u0300',5:'\u0302',7:'\u0304',8:'\u030d'};
function pronunciationKey(row){
 return row.poj.toLowerCase().normalize('NFD').replace(/o([\u0300-\u030f]*)\u0358/g,'oo$1')
 .replace(/ⁿ/g,'nn').replace(/[\u0300-\u036f]/g,'').replace(/^tsh/,'chh').replace(/^ts/,'ch')+'|'+Number(row.tone);
}
function targetReading(row){
 const [original]=pronunciationKey(row).split('|');
 const h=/h$/.test(original)&&[4,8].includes(Number(row.tone));
 const tone=h?(Number(row.tone)===4?2:3):({1:7,2:1,3:2,4:8,5:7,7:3,8:4})[Number(row.tone)];
 const base=h?original.slice(0,-1):original;
 let poj=row.poj.normalize('NFD').replace(/[\u0300\u0301\u0302\u0304\u030d]/g,'');
 if(h)poj=poj.slice(0,-1);
 const chars=[...poj];let at=-1;
 for(const vowel of ['a','o','e']){at=chars.indexOf(vowel);if(at>=0)break;}
 if(at<0){const bare=chars.join('').replace(/ⁿ/g,'');const special=/iu$/.test(bare)?'u':/ui$/.test(bare)?'i':null;
  if(special)at=chars.lastIndexOf(special);else for(let i=chars.length-1;i>=0;i--){if(/[iumn]/.test(chars[i])){at=i;break;}}
 }
 if(MARKS[tone]&&at>=0)chars.splice(at+1,0,MARKS[tone]);
 return {key:base+'|'+tone,tone,poj:chars.join('').normalize('NFC'),rule:h?'h 韻尾依一般連讀變調去 h':Number(row.tone)===5?'第 5 調採 5 → 7（偏漳腔）':'一般連讀變調'};
}
function buildPairs(rows,pool){

 for(const row of rows){const target=targetReading(row),matched=index.get(target.key)||null,clip=matched?{...matched,poj:target.poj}:null;pairs[pronunciationKey(row)]={...target,clip};}

}

const TONES = [1, 2, 3, 4, 5, 7, 8];

function selectPart(rows, current, kind, value) {
  let candidates = rows.filter(row => row.onset === (kind === 'onset' ? value : current.onset));
  if (kind !== 'onset') candidates = candidates.filter(row => row.final === (kind === 'final' ? value : current.final));
  return candidates.find(row => row.tone === (kind === 'tone' ? Number(value) : current.tone)) || candidates[0] || current;
}
function shuffled(rows, random = Math.random) {

}
function nextExample(rows, current, random = Math.random) {

  return candidates[Math.floor(random() * candidates.length)] || current;
}
function matchedEnding(row, letter) {
  return [4, 8].includes(row.tone) && row.final.includes(letter);

function playCurrent(kind='base') {
  if(!state.ready)return;
  const pair=state.pairs[pronunciationKey(state.current)];
  if(kind==='sandhi'&&!pair?.clip)return;
  const row=kind==='sandhi'?pair.clip:state.current;
  const label=kind==='sandhi'?'變音':'本音',button=kind==='sandhi'?$('playSandhi'):$('play');
  cancelPlayback();
  const generation=state.generation;
  let retried=false;
  const failed=error=>{
    if(generation!==state.generation||error?.name==='AbortError')return;
    // A genuine media/network failure may retry the same official recording.
    const official=row.officialAudio||(/\.mp3(?:\?|$)/i.test(row.source)?row.source:null);
    if(error?.name!=='NotAllowedError'&&!retried&&official){retried=true;audio.src=official;attempt();return;}
    stopAuto();button.setAttribute('aria-pressed','false');
    $('pairStatus').textContent=error?.name==='NotAllowedError'?'請點擊本音或變音按鈕啟用聲音。':'此音檔暫時無法播放，請重試或開啟該錄音的教育部來源。';
  };

    audio.muted=false;audio.volume=1;
    try{Promise.resolve(audio.play()).then(()=>{
      if(generation!==state.generation)return;
      button.setAttribute('aria-pressed','true');
      $('pairStatus').textContent=`正在播放${label}：${row.poj}（例字：${row.han}）`;
    }).catch(failed);}catch(error){failed(error);}
  };
  audio.onended=()=>{if(generation===state.generation){button.setAttribute('aria-pressed','false');$('pairStatus').textContent=`${label}播放完成。`;}};
  audio.onerror=()=>{if(audio.error)failed(audio.error);};

}

const voice=document.getElementById('voice');
const playButton=document.querySelector('.play');
function setBasePlayLabel(label){playButton.textContent=$('tAuto').classList.contains('on')?'▶ 再聽一次':label;}
const voiceStatus=document.getElementById('voiceStatus');
let activeClip=null;
const sandhiButton=$('playSandhiMain'),mainSandhiSource=$('mainSandhiSource'),mainSandhiExample=$('mainSandhiExample');
let mainSandhiPairs=JSON.parse(unpackText($('mainSandhiPairsData').textContent)),mainSandhiClip=null,playbackClip=null,playbackKind='base';
function updateSandhiControl(){
 const pair=mainSandhiPairs[voiceKey(spell())+'|'+s.t];
 mainSandhiClip=pair?.clip||null;

 const hasSandhiAudio=Boolean(mainSandhiClip?.audio||mainSandhiClip?.officialAudio);
 sandhiButton.classList.toggle('has-recording',hasSandhiAudio);
 sandhiButton.disabled=!hasSandhiAudio;
 sandhiButton.style.color=hasSandhiAudio?'var(--ac)':'var(--mut)';
 sandhiButton.style.opacity=hasSandhiAudio?'1':'.5';
 sandhiButton.textContent=hasSandhiAudio?'播放變音':'變音未收錄';
 if(mainSandhiClip&&!sandhiButton.disabled)prefetchClip(mainSandhiClip);
 sandhiButton.title=!activeClip&&!mainSandhiClip?'此組合尚無核對完成的本音錄音':mainSandhiClip
 ?mainSandhiClip.kind==='context'?`變音 ${pair.poj}；播放「${mainSandhiClip.han}」完整詞音（${mainSandhiClip.sourceReading}），請聽${sandhiListeningPosition(mainSandhiClip)}的連讀變調。`:`變音 ${pair.poj}；配對例字：${mainSandhiClip.han}。採另一例字的本調錄音示範。`
 :'此本音有錄音，但目前尚無對應的變音錄音';
}
function positionSandhiExample(){
 const group=$('tAuto').classList.contains('on')?$('autoControlGroup'):$('sandhiControlGroup');
 group.append(mainSandhiExample);
}
function sandhiListeningPosition(clip){return clip.syllableIndex>0?'第'+(clip.syllableIndex+1)+'音':'首音';}
function showSandhiSource(){
 mainSandhiSource.replaceChildren();mainSandhiSource.hidden=true;
 const pair=mainSandhiPairs[voiceKey(spell())+'|'+s.t];
 positionSandhiExample();mainSandhiExample.textContent=`變音例音 · ${pair.poj} · ${mainSandhiClip.han}${mainSandhiClip.kind==='context'?`（完整詞音，聽${sandhiListeningPosition(mainSandhiClip)}）`:''}`;mainSandhiExample.hidden=false;
}
// Keep the pairing table in the HTML so the initial tap never waits for a second request.
const MANUAL_STATE_KEY='poj-combiner-manual-selection-v1';
function rememberManualSelection(){
 if(!$('t1').classList.contains('on'))return;
 try{localStorage.setItem(MANUAL_STATE_KEY,JSON.stringify(s));}catch{}
}
function restoreManualSelection(){
 try{
  const saved=JSON.parse(localStorage.getItem(MANUAL_STATE_KEY)||'null');
  if(!saved||!INI.includes(saved.i)||!VOW.includes(saved.v)||!COD.includes(saved.c)||!TON.some(t=>t[0]===saved.t))return;
  if(/[ptkhⁿ]$/.test(saved.v)&&saved.c)return;
  const stop=STOP.includes(saved.c)||/[ptkh]$/.test(saved.v);
  if(stop?![4,8].includes(saved.t):[4,8].includes(saved.t))return;
  s={i:saved.i,v:saved.v,c:saved.c,t:saved.t};
 }catch{}
}

let HOMOPHONES={},homophoneKey='',selectedHomophone=null;
let manualBPractice=false,manualBTimer=null,manualBTargetKey='',manualBChoices=null,manualBInitial=false;
function manualBChinese(key){
 const base=sourceChinese(VOICES[key]);
 return [...new Set([base,...(HOMOPHONES[key]||[]).map(entry=>entry.han)].filter(Boolean))];
}
function manualBPool(){
 if(manualBChoices)return manualBChoices;
 const seen=new Set();manualBChoices=[];
 for(const [i,v,c] of MANUAL_SYLLABLES){
  const stop=/[ptkh](?:ⁿ)?$/.test(v+c);
  for(const t of (stop?[4,8]:[1,2,3,5,7])){
   const key=voiceKey(i+v+c)+'|'+t;
   if(!seen.has(key)&&manualBChinese(key).length){seen.add(key);manualBChoices.push({i,v,c,t,key});}
  }
 }
 return manualBChoices;
}
function stopManualBPractice(){
 clearInterval(manualBTimer);manualBTimer=null;manualBPractice=false;manualBTargetKey='';
 $('p1').classList.remove('manual-b-practice');$('manualBTarget').hidden=true;
 $('word').classList.remove('answer-correct');
}
function restartManualBTimer(){
 clearInterval(manualBTimer);
 if(manualBPractice)manualBTimer=setInterval(nextManualBQuestion,Number($('autoSpeed').value)*1000);
}
function nextManualBQuestion(initial=false){
 if(!manualBPractice||!$('t1').classList.contains('on'))return;
 const choices=manualBPool();if(!choices.length)return;
 let index=Math.floor(Math.random()*choices.length);
 if(choices[index].key===manualBTargetKey&&choices.length>1)index=(index+1)%choices.length;
 const choice=initial?{i:'ph',v:'au',c:'',t:5,key:'phau|5'}:choices[index];manualBInitial=initial;manualBTargetKey=choice.key;
 s={i:choice.i,v:choice.v,c:choice.c,t:choice.t};
 $('p1').classList.remove('no-match','manual-action');
 $('manualBTarget').textContent=spell().normalize('NFC');
 $('manualBTarget').classList.add('obscured');
 $('word').value='';$('word').classList.remove('answer-correct');
 draw();updateVoice();
 $('word').dispatchEvent(new Event('practicequestion'));
}
function startManualBPractice(initial=false){
 if(manualBPractice&&!initial)return;
 stopAuto();manualBPractice=true;
 $('p1').classList.add('manual-b-practice');$('manualBTarget').hidden=false;
 $('autoSpeed').disabled=false;
 nextManualBQuestion(initial);restartManualBTimer();
}

for(const id of ['manualBTarget','sourceHanzi']){
 $(id).addEventListener('click',()=>{if(manualBPractice)$('manualBTarget').classList.remove('obscured');});
}
let autoRevealTimer=null,autoRevealGeneration=0,autoWordRevealed=false;
function refreshExampleDisplay(){
 const changed=$('tAuto').classList.contains('on')&&autoWordRevealed;
 const field=$('sourceHanzi');
 field.textContent=manualBPractice?(manualBInitial?'袍':manualBChinese(manualBTargetKey).join('、')):changed?spell(SANDHI_TONE_MAP[s.t]):selectedHomophone?.han||'';
 field.dataset.phase=changed?'sandhi':'chinese';
 field.setAttribute('aria-label',changed?'變音後白話字':'例音中文');
}
function clearAutoReveal(){
 if(autoRevealTimer!==null)clearTimeout(autoRevealTimer);
 autoRevealTimer=null;autoRevealGeneration++;
}
function scheduleAutoReveal(){
 if(!autoRunning||!$('tAuto').classList.contains('on'))return;
 const generation=autoRevealGeneration;
 autoRevealTimer=setTimeout(()=>{
  if(generation!==autoRevealGeneration||!autoRunning||!$('tAuto').classList.contains('on'))return;
  autoRevealTimer=null;autoWordRevealed=true;refreshExampleDisplay();
 },Number($('autoSpeed').value)*500);
}
function restartAutoReveal(){
 clearAutoReveal();autoWordRevealed=false;refreshExampleDisplay();scheduleAutoReveal();
}

function renderHomophones(){
 if($('p1').classList.contains('no-match'))return;
 const key=voiceKey(spell())+'|'+s.t;
 const base=sourceChinese(activeClip);
 const entries=[],seen=new Set();
 for(const entry of [...(base?[{han:base,source:activeClip.source}]:[]),...(HOMOPHONES[key]||[])]){
  if(!seen.has(entry.han)){seen.add(entry.han);entries.push(entry);}
 }
 if(key!==homophoneKey){homophoneKey=key;selectedHomophone=null;}
 selectedHomophone=entries.find(entry=>entry.han===selectedHomophone?.han)||entries[0]||null;
 $('homophones').hidden=!entries.length;
 refreshExampleDisplay();
 $('homophoneList').replaceChildren();
 $('homophoneCount').textContent=entries.length?'（'+entries.length+'）':'';
 for(const entry of entries){
  const button=document.createElement('button');button.type='button';button.textContent=entry.han;
  button.setAttribute('aria-pressed',String(entry.han===selectedHomophone?.han));
  button.onclick=()=>{
   if(selectedHomophone?.han===entry.han)return;
   selectedHomophone=entry;renderHomophones();restartAutoCycle();
  };
  $('homophoneList').append(button);

const clipObjectURLs=new Map(),pendingClipLoads=new Map();
function prefetchClip(clip){
 if(!clip)return Promise.resolve(null);
 if(clipObjectURLs.has(clip.audio))return Promise.resolve(clipObjectURLs.get(clip.audio));
 if(pendingClipLoads.has(clip.audio))return pendingClipLoads.get(clip.audio);
 const task=fetch(clip.audio,{credentials:'same-origin'}).then(response=>{
  if(!response.ok)throw Error('Audio preload failed');return response.blob();
 }).then(blob=>{
  if(blob.size<128||blob.type&&!/audio|octet-stream/i.test(blob.type))throw Error('Unexpected audio response');
  // Use an explicit MP3 MIME type for iPhone playback of cached file data.
  const url=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
  clipObjectURLs.set(clip.audio,url);
  for(const [key,cachedURL] of clipObjectURLs){
   if(clipObjectURLs.size<=6)break;
   if(key!==activeClip?.audio&&key!==playbackClip?.audio){clipObjectURLs.delete(key);URL.revokeObjectURL(cachedURL);}
  }
  return url;
 }).catch(()=>null).finally(()=>pendingClipLoads.delete(clip.audio));
 pendingClipLoads.set(clip.audio,task);return task;
}
function preferredAudioSource(clip){
 return clipObjectURLs.get(clip.audio)||clip.audio||clip.officialAudio;
}

function voiceKey(text){
 return text.toLowerCase().normalize('NFD').replace(/o([\u0300-\u030f]*)\u0358/g,'oo$1')
 .replace(/ⁿ/g,'nn').replace(/[\u0300-\u036f]/g,'').replace(/^tsh/,'chh').replace(/^ts/,'ch');
}
let playbackAttempt=0,playRequested=false,playbackFallback=null;
function sourceChinese(clip){
 const label=clip?.han?.trim()||'';
 return !/^拼音(?:\s|$)/u.test(label)&&/\p{Script=Han}/u.test(label)?label:'';
}
function updateVoice(){
 clearAutoReveal();autoWordRevealed=false;

 activeClip=VOICES[voiceKey(spell())+'|'+s.t]||null;
 playbackClip=activeClip;playbackKind='base';sandhiButton.setAttribute('aria-pressed','false');mainSandhiSource.hidden=true;mainSandhiExample.hidden=true;updateSandhiControl();
 renderHomophones();
 playButton.disabled=!(activeClip?.audio||activeClip?.officialAudio);
 voiceStatus.classList.toggle('has-source',Boolean(activeClip));

 }else{

function playbackFailure(error,attempt){
 if(attempt!==playbackAttempt||error?.name==='AbortError')return;
 if(playbackKind==='sandhi'){
  sandhiButton.setAttribute('aria-pressed','false');
  sandhiButton.title='變音播放失敗，請再點一次重試。';
  mainSandhiSource.hidden=false;
  mainSandhiSource.append(document.createElement('br'),'變音播放失敗，請再次點擊「播放變音」重試。');
  return;
 }
 const wasAutomatic=autoRunning;
 if(wasAutomatic){stopAuto();$('autoToggle').textContent='繼續';}
 setBasePlayLabel('▶ 重試播放');
 playButton.title=wasAutomatic
 ?'聲音未能啟動，請點「繼續」重新啟動自動發音。'
 :error?.name==='NotAllowedError'
 ?'請點下方播放器的 ▶；若仍無聲，請用 Safari 開啟此網頁。'
 :'播放未成功，請點下方播放器的 ▶ 或「直接開啟音檔」。';
}
function recoverPlayback(error,attempt){
 if(attempt!==playbackAttempt||error?.name==='AbortError'||!playbackClip)return;
 if(error?.name==='NotAllowedError'){prefetchClip(playbackClip);playbackFailure(error,attempt);return;}
 if(playbackFallback?.attempt===attempt)return playbackFallback.task;
 const clip=playbackClip,failedSource=voice.getAttribute('src');
 const fallback={attempt,task:null};playbackFallback=fallback;
 fallback.task=(async()=>{
  const cached=await prefetchClip(clip);
  if(attempt!==playbackAttempt||clip!==playbackClip)return;
  const alternatives=[...new Set([cached,clip.officialAudio,clip.audio].filter(url=>url&&url!==failedSource))];
  let lastError=error;
  for(const source of alternatives){
   if(attempt!==playbackAttempt||clip!==playbackClip||!playRequested)return;
   voice.src=source;voice.load();voice.muted=false;voice.volume=1;
   try{await voice.play();return;}catch(e){
    if(e?.name==='AbortError')return;
    lastError=e;if(e?.name==='NotAllowedError')break;
   }
  }
  playbackFailure(lastError,attempt);
 })();
 return fallback.task;
}
function playCurrent(kind='base'){
 const clip=kind==='sandhi'?mainSandhiClip:activeClip;
 if(!clip||kind==='sandhi'&&sandhiButton.disabled)return;
 playbackKind=kind;playbackClip=clip;
 sandhiButton.setAttribute('aria-pressed','false');
 if(kind==='sandhi'){voice.hidden=false;showSandhiSource();if(activeClip)setBasePlayLabel('▶ 播放教育部真人錄音');}
 else{mainSandhiSource.hidden=true;mainSandhiExample.hidden=true;}
 const attempt=++playbackAttempt;playRequested=true;playbackFallback=null;
 voice.pause();voice.muted=false;voice.defaultMuted=false;voice.volume=1;
 const source=preferredAudioSource(clip);
 if(voice.getAttribute('src')!==source){voice.src=source;voice.load();}
 if(voice.readyState>0){try{voice.currentTime=0;}catch{}}
 if(kind==='base'){setBasePlayLabel('▶ 載入錄音…');playButton.title='正在準備錄音…';}else sandhiButton.title='正在準備變音錄音…';
 try{
  // Keep the first play() synchronous with the user's iPhone tap.
  const result=voice.play();
  if(result)result.catch(error=>recoverPlayback(error,attempt));
 }catch(error){recoverPlayback(error,attempt);}
}

sandhiButton.onclick=()=>playCurrent('sandhi');
voice.onplay=()=>{playRequested=true;};
voice.onplaying=()=>{if(playbackKind==='sandhi'){sandhiButton.setAttribute('aria-pressed','true');sandhiButton.title='正在播放變音配對錄音。';}else{setBasePlayLabel('◼ 播放中…');playButton.title='正在播放教育部真人錄音。';}};
voice.onended=()=>{if(playbackKind==='sandhi'){sandhiButton.setAttribute('aria-pressed','false');updateSandhiControl();}else{setBasePlayLabel('▶ 再聽一次');playButton.title='播放完成。';}};
voice.onpause=()=>{sandhiButton.setAttribute('aria-pressed','false');if(activeClip&&!voice.ended){setBasePlayLabel('▶ 播放教育部真人錄音');}};
voice.onwaiting=()=>{if(!voice.paused)(playbackKind==='sandhi'?sandhiButton:playButton).title='正在載入錄音，請稍候…';};
voice.onerror=()=>{

 if(playRequested){recoverPlayback(voice.error,playbackAttempt);return;}
 const clip=playbackClip,attempt=playbackAttempt;
 prefetchClip(clip).then(url=>{
  if(attempt!==playbackAttempt||clip!==playbackClip||playRequested)return;
  if(url&&voice.getAttribute('src')!==url){voice.src=url;voice.load();}
  else playbackFailure(voice.error,attempt);
 });
};

function autoPool(){

  var m = /([A-Za-z\u00C0-\u024F\u1E00-\u1EFF\u0300-\u036F\u207F]+)([1-5789])$/.exec(v.slice(0, c));
  if (!m) return;
  var x = decodeToken(m[1]);
  if (!x) return;
  var out = pojSyllable(x.ascii, m[2], opts());
  record(out, m[2]);
  var start = c - m[0].length;
  ed.value = v.slice(0, start) + out + v.slice(c);
  var pos = start + out.length;
  ed.setSelectionRange(pos, pos);
}
var VOWEL_BEFORE_NN = /[aeiouAEIOU\u00C0-\u017F\u1E00-\u1EFF\u0300-\u036F]$/;
function liveSpecial() {
  var c = ed.selectionStart, v = ed.value, b = v.slice(0, c), m, rep = null, n = 0;
  if ((m = /([Oo])[Oo]$/.exec(b))) { rep = m[1] + '\u0358'; n = 2; }
  else if (/[Nn][Nn]$/.test(b) && VOWEL_BEFORE_NN.test(b.slice(0, -2))) { rep = '\u207F'; n = 2; }
  else if ((m = /([uUoO])[rR]$/.exec(b))) { rep = (m[1] + '\u0324').normalize('NFC'); n = 2; }
  if (!rep) return;
  ed.value = b.slice(0, c - n) + rep + v.slice(c);
  var p = c - n + rep.length;
  ed.setSelectionRange(p, p);
}
const syllables = new Map(MANUAL_SYLLABLES.map(parts => [voiceKey(parts.join('')), parts]));
function updateCardFromEditor() {
  if ($('p1').hidden) return;
  if(manualBPractice&&$('t1').classList.contains('on')){
    const input=ed.value.trim(),decoded=decodeToken(input);
    const tone=decoded&&Number(decoded.tone||entered.get(input)||(isStop(decoded.ascii.toLowerCase())?4:1));
    const correct=Boolean(decoded&&voiceKey(decoded.ascii)+'|'+tone===manualBTargetKey);
    ed.classList.toggle('answer-correct',correct);
    if(correct)$('manualBTarget').classList.remove('obscured');
    return;
  }
  const caret = ed.selectionStart;
  const tokens = tokenize(ed.value);
  const token = tokens.find(item => item.start <= caret && caret <= item.end);
  const decoded = token && decodeToken(token.text);
  const parts = decoded && syllables.get(voiceKey(token.text));
  const tone = decoded && Number(decoded.tone || entered.get(token.text) || (isStop(decoded.ascii.toLowerCase()) ? 4 : 1));
  const match = parts && TON.some(entry => entry[0] === tone) && toneOk(decoded.ascii.toLowerCase(), String(tone));
  $('p1').classList.toggle('no-match', !match);
  if (!match) {
    voice.pause(); activeClip=null; mainSandhiClip=null; playbackAttempt++;
    selectedHomophone=null; $('sourceHanzi').textContent='';
    voiceStatus.textContent=token?'未找到對應的閃卡':'';
    return;
  }
  const [i,v,c] = parts;
  if (s.i===i && s.v===v && s.c===c && s.t===tone && ed.dataset.matched==='yes') return;
  s={i,v,c,t:tone};
  draw(); updateVoice(); rememberManualSelection();
}
ed.addEventListener('practicequestion', function () { entered.clear(); ed.dataset.matched=''; ed.setSelectionRange(0,0); rememberRange(); });
ed.addEventListener('cardrestore', function () { ed.dataset.matched=''; refresh(); rememberRange(); });
function refresh() {
  const manualA = $('tB').classList.contains('on');
  ed.hidden = manualA;
  $('manualWord').hidden = !manualA;
  updateCardFromEditor();
  $('manualWord').textContent=ed.value;
  ed.dataset.matched = $('p1').classList.contains('no-match') ? '' : 'yes';
}
function onInput(e) {
  if (!e || !e.inputType || /^insert/.test(e.inputType)) liveSpecial();
  convertAtCaret();
  refresh();
}
// Keep the editor range when a touch, mouse, or keyboard moves focus to a key.
var editorRange = { start: ed.selectionStart, end: ed.selectionEnd };
function rememberRange() {
  editorRange = { start: ed.selectionStart, end: ed.selectionEnd };
}
['input', 'select', 'keyup', 'click', 'blur'].forEach(function (event) {
  ed.addEventListener(event, rememberRange);
});
document.addEventListener('selectionchange', function () {
  if (document.activeElement === ed) rememberRange();
});
function previousLetterStart(text, end) {
  const prefix = text.slice(0, end);
  if (!prefix) return 0;
  if (typeof Intl !== 'undefined' && Intl.Segmenter) {
    const letters = new Intl.Segmenter('nan', { granularity: 'grapheme' }).segment(prefix);
    return letters.containing(end - 1).index;
  }
  let start = end - 1;
  while (start > 0 && /[\u0300-\u036f]/.test(text[start])) start--;
  return start;
}
function editManualCard(action) {
  const displayed = $('manualWord').textContent;
  const end = action === '__clear__' ? 0 : previousLetterStart(displayed, displayed.length);
  ed.value = displayed.slice(0, end);
  $('manualWord').textContent = ed.value;
  $('p1').classList.add('manual-action');
  // The flashcard and its audio still belong to the selected combination.
}
function insert(t) {
  var a = Math.min(editorRange.start, ed.value.length);
  var b = Math.min(editorRange.end, ed.value.length);
  var out = t;
  if (t === '__clear__') {
    ed.value = '';
    entered.clear();
    clearTimeout(timer);
    st.textContent = '';
    if (!ed.hidden && !ed.readOnly) ed.focus({ preventScroll: true });
    ed.setSelectionRange(0, 0);
    rememberRange();
    refresh();
    return;
  }
  if (t === '__backspace__') {
    out = '';
    if (a === b && a > 0) {
      a = previousLetterStart(ed.value, a);
    }
  }
  // A dot key after an existing o adds the dot to that letter.
  if (t === 'o\u0358' && a === b) {
    var lastO = /[oO](?:[\u0300-\u036f]*)$/.exec(ed.value.slice(0, a).normalize('NFD'));
    if (lastO) {
      var previous = Array.from(ed.value.slice(0, a)).pop() || '';
      // Find the original grapheme without changing offsets elsewhere.
      var start = a;
      while (start > 0 && /[\u0300-\u036f]/.test(ed.value[start - 1])) start--;
      if (start > 0) start--;
      var letter = ed.value.slice(start, a).normalize('NFD');
      if (/^[oO][\u0300-\u036f]*$/.test(letter)) {
        a = start;
        out = (letter.replace(/\u0358/g, '') + '\u0358').normalize('NFC');
      }
    }
  }
  // An explicit tone key always acts on the syllable, even with auto conversion off.
  if (/^[1-5789]$/.test(t)) {
    var selected = ed.value.slice(a, b);
    var before = /[A-Za-z\u00C0-\u024F\u1E00-\u1EFF\u0300-\u036F\u207F]+$/.exec(ed.value.slice(0, a));
    var token = selected || (before ? before[0] : '');
    var decoded = decodeToken(token);
    if (!decoded) { say('請先輸入音節，再點聲調鍵'); return; }
    if (!selected) a -= token.length;
    out = pojSyllable(decoded.ascii, t, opts());
    if (out === pojSyllable(decoded.ascii, '1', opts()) && TONE[t]) {
      say('請先輸入母音，再點聲調鍵'); return;
    }
    record(out, t);
  }
  ed.value = ed.value.slice(0, a) + out + ed.value.slice(b);
  if (!ed.hidden && !ed.readOnly) ed.focus({ preventScroll: true });
  ed.setSelectionRange(a + out.length, a + out.length);
  rememberRange();
  refresh();
}
ed.addEventListener('input', onInput);
ed.addEventListener('compositionend', function () { liveSpecial(); convertAtCaret(); refresh(); });
ed.addEventListener('keyup', function (e) { if (/Arrow|Home|End|Page/.test(e.key)) refresh(); });
ed.addEventListener('click', function () {
  if ($('t1').classList.contains('on') && !ed.readOnly) { startManualBPractice(); insert('__clear__'); }
  else refresh();
});
ed.addEventListener('paste', function () { setTimeout(function () {
  var r = pojText(ed.value, opts()); if (r !== ed.value) { ed.value = r; ed.setSelectionRange(r.length, r.length); }
  refresh();
}, 0); });
keyboard.querySelectorAll('[data-insert]').forEach(function (b) {
  b.addEventListener('mousedown', function (e) { e.preventDefault(); });
  b.addEventListener('pointerdown', function (e) {
    if (document.activeElement === ed) rememberRange();
    e.preventDefault();
  });
  b.addEventListener('click', function () { insert(b.getAttribute('data-insert')); });
});
document.querySelectorAll('[data-editor-action]').forEach(function (button) {
  button.addEventListener('pointerdown', function (event) {
    if (document.activeElement === ed) rememberRange();
    event.preventDefault();
  });
  button.addEventListener('mousedown', function (event) { event.preventDefault(); });
  button.addEventListener('click', function () {
    stopAuto();
    if ($('tB').classList.contains('on')) editManualCard(button.dataset.editorAction);
    else insert(button.dataset.editorAction);
  });
});
ed.setSelectionRange(ed.value.length, ed.value.length);
rememberRange();

})();
// Enter the default Manual B practice immediately, without an input-field click.
show(1);
startManualBPractice(true);
</script>
